<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#e8eaee" />
    <title>Page not found · React Playground</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --ink: #1c2430;
        --muted: #5c6678;
        --shadow: 0 1px 2px rgba(28, 36, 48, 0.06), 0 12px 32px rgba(28, 36, 48, 0.08);
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        color-scheme: light;
        font-family: system-ui, -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(rgba(40, 48, 64, 0.14) 1px, transparent 1px) 0 0 / 16px 16px,
          radial-gradient(120% 80% at 10% 0%, #f0f2f6 0%, transparent 55%),
          radial-gradient(90% 70% at 100% 100%, #dce1ea 0%, transparent 50%),
          #e8eaee;
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100svh;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box;
      }

      main {
        display: grid;
        justify-items: center;
        gap: 24px;
        text-align: center;
      }

      .tiles {
        display: flex;
        gap: 16px;
      }

      .tile {
        display: grid;
        place-items: center;
        width: clamp(80px, 22vw, 128px);
        aspect-ratio: 1;
        border-radius: 24px;
        box-shadow: var(--shadow);
        color: #fff;
        font-size: clamp(48px, 13vw, 80px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        animation: tile-in 520ms var(--ease-out) backwards;
        transition: translate 200ms var(--ease-out);
      }

      .tile:nth-child(1) {
        background: #2448d8;
      }

      /* The Hello There card: white light split into a spectrum at its edges. */
      .tile:nth-child(2) {
        background: #000;
        text-shadow:
          -2px 0 rgba(255, 70, 70, 0.7),
          2px 0 rgba(70, 150, 255, 0.7),
          0 0 18px rgba(255, 255, 255, 0.35);
        animation-delay: 60ms;
      }

      .tile:nth-child(3) {
        background: #ff9f1c;
        animation-delay: 120ms;
      }

      h1 {
        margin: 8px 0 0;
        font-size: 1.25rem;
        font-weight: 600;
        line-height: 1.3;
      }

      p {
        margin: -16px 0 0;
        max-width: 22rem;
        text-wrap: balance;
        font-size: 0.875rem;
        line-height: 1.5;
        color: var(--muted);
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 20px 0 16px;
        border-radius: 999px;
        background: #111113;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        box-shadow: 0 1px 1px rgba(15, 15, 17, 0.04), 0 6px 18px rgba(15, 15, 17, 0.1);
        transition: scale 140ms var(--ease-out);
      }

      a:active {
        scale: 0.97;
      }

      a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      @media (hover: hover) and (pointer: fine) {
        .tile:hover {
          translate: 0 -4px;
        }
      }

      @keyframes tile-in {
        from {
          opacity: 0;
          translate: 0 12px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .tile,
        a {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="tiles" aria-hidden="true">
        <span class="tile">4</span>
        <span class="tile">0</span>
        <span class="tile">4</span>
      </div>
      <h1><span class="sr-only">404: </span>No component here</h1>
      <p>This page isn’t in the catalog. It may have moved, or it never existed.</p>
      <a href="/">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.5" />
          <rect x="9" y="1.5" width="5.5" height="5.5" rx="1.5" />
          <rect x="1.5" y="9" width="5.5" height="5.5" rx="1.5" />
          <rect x="9" y="9" width="5.5" height="5.5" rx="1.5" />
        </svg>
        Show all components
      </a>
    </main>
  </body>
</html>
