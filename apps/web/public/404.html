<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#e8eaee" />
    <script src="/theme.js"></script>
    <title>Page not found · Trev’s Studio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --ink: #1c2430;
        --muted: #5c6678;
        --accent: #2a5cff;
        --canvas: #e8eaee;
        --glow: #f0f2f6;
        --shade: #dce1ea;
        --grid-dot: rgba(40, 48, 64, 0.14);
        --off-dot: rgba(40, 48, 64, 0.2);
        --button: #111113;
        --button-hover: #2a2c33;
        --button-ink: #ffffff;
        --pitch: clamp(13px, 3.9vw, 22px);
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        /* The deck's pill spring, sampled for CSS. */
        --spring: linear(0, 0.145, 0.433, 0.714, 0.921, 1.038, 1.084, 1.084, 1.062, 1.036, 1.014, 1.001, 0.994, 0.992, 0.994, 0.996, 1);
        color-scheme: light;
        font-family: system-ui, -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(var(--grid-dot) 1px, transparent 1px) 0 0 / 16px 16px,
          radial-gradient(120% 80% at 10% 0%, var(--glow) 0%, transparent 55%),
          radial-gradient(90% 70% at 100% 100%, var(--shade) 0%, transparent 50%),
          var(--canvas);
        -webkit-font-smoothing: antialiased;
      }

      /* The site's dark theme, from app.css; /theme.js picks it before first paint. */
      :root[data-theme="dark"] {
        --ink: #f5f7fa;
        --muted: #a2abbb;
        --accent: #7d99ff;
        --canvas: #1d2026;
        --glow: #262a31;
        --shade: #16181d;
        --grid-dot: rgba(214, 222, 236, 0.12);
        --off-dot: rgba(214, 222, 236, 0.2);
        --button: #ffffff;
        --button-hover: #e3e6ec;
        --button-ink: #111113;
        color-scheme: dark;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100svh;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box;
      }

      main {
        display: grid;
        justify-items: center;
        gap: 24px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        line-height: 1.3;
      }

      /* 404 drawn from the canvas's own dots: three 5x7 digits with a column between each. */
      .matrix {
        display: grid;
        grid-template-columns: repeat(17, var(--pitch));
        grid-auto-rows: var(--pitch);
        place-items: center;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      .matrix i {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
      }

      /* --heat (0 to 1) is how close the pointer is: 404.js sets it on the dots near the cursor or finger. */
      .matrix i::before {
        content: "";
        border-radius: 50%;
        scale: calc(1 + var(--heat, 0) * var(--swell));
        background: color-mix(in oklab, var(--accent) calc(min(1, var(--heat, 0) * 1.8) * 100%), var(--dot));
        transition:
          scale 720ms var(--spring),
          background-color 1100ms ease-in-out;
      }

      .matrix i[data-lit]::before {
        transition:
          scale 160ms var(--ease-out),
          background-color 90ms linear;
      }

      .off::before {
        --dot: var(--off-dot);
        --swell: 2.2;
        width: 3px;
        height: 3px;
      }

      .on::before {
        --dot: var(--ink);
        --swell: 0.45;
        width: calc(var(--pitch) * 0.72);
        aspect-ratio: 1;
        animation: dot-in 640ms var(--spring) calc(80ms + var(--i) * 22ms) backwards;
      }

      /* A tap or click sends one ripple out through the digits from where it landed. */
      .matrix[data-ping] .on::before {
        animation: ping 560ms var(--ease-out) calc(var(--ring) * 32ms) backwards;
      }

      p {
        margin: 0;
        max-width: 22rem;
        text-wrap: balance;
        font-size: 0.875rem;
        line-height: 1.5;
        color: var(--muted);
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 20px 0 16px;
        border-radius: 999px;
        background: var(--button);
        color: var(--button-ink);
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        box-shadow: 0 1px 1px rgba(15, 15, 17, 0.04), 0 6px 18px rgba(15, 15, 17, 0.1);
        -webkit-tap-highlight-color: transparent;
        transition:
          scale 140ms var(--ease-out),
          background-color 140ms var(--ease-out);
      }

      a:active {
        scale: 0.97;
      }

      a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      @media (hover: hover) and (pointer: fine) {
        a:hover {
          background: var(--button-hover);
        }
      }

      @keyframes dot-in {
        from {
          scale: 0.2;
          background: var(--off-dot);
        }
      }

      @keyframes ping {
        35% {
          scale: 1.3;
          background: var(--accent);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .matrix i::before,
        .matrix i[data-lit]::before,
        .matrix[data-ping] .on::before,
        a {
          scale: none;
          animation: none;
          transition: none;
        }
      }
    </style>
    <script src="/404.js" defer></script>
