name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      site-url: ${{ steps.site.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Lint workflows
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read the production origin from wrangler.json
        id: site
        run: |
          host="$(jq -r '.routes[] | select(.custom_domain) | .pattern' apps/web/wrangler.json)"
          if [ -z "$host" ]; then
            echo "::error::apps/web/wrangler.json has no custom_domain route."
            exit 1
          fi
          echo "url=https://$host" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build the Live app
        run: bun run build
        env:
          SITE_URL: ${{ steps.site.outputs.url }}

      - name: Check the build ships only allowlisted files
        run: bun run --cwd apps/web check:deploy

      - name: Package the Worker without deploying
        working-directory: apps/web
        run: bunx wrangler deploy --dry-run

      - name: Smoke test the build on a local Worker
        timeout-minutes: 3
        run: bun run --cwd apps/web smoke:local --no-build

      - name: Install Chromium for the phone layout check
        working-directory: apps/web
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Check every card fits a phone page unscaled
        timeout-minutes: 3
        run: bun run --cwd apps/web check:phone

      - name: Upload the tested build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-build
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: prod
      url: ${{ needs.verify.outputs.site-url }}
    concurrency:
      group: production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/web
    env:
      SITE_URL: ${{ needs.verify.outputs.site-url }}
    steps:
      - name: Skip commits that are no longer main
        id: fresh
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_DEPLOY_TOKEN and CLOUDFLARE_ACCOUNT_ID in the prod environment (docs/DEPLOYMENT.md)."
            exit 1
          fi
          head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying ${GITHUB_SHA}: main is now ${head}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Checkout
        if: steps.fresh.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        if: steps.fresh.outputs.current == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install pinned Wrangler
        if: steps.fresh.outputs.current == 'true'
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Download the tested build
        if: steps.fresh.outputs.current == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: live-build
          path: apps/web/dist

      - name: Check the build ships only allowlisted files
        if: steps.fresh.outputs.current == 'true'
        run: bun run check:deploy

      - name: Record the live version for rollback
        if: steps.fresh.outputs.current == 'true'
        id: previous
        run: |
          worker="$(jq -r .name wrangler.json)"
          workers="$(curl -sSf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          if ! printf '%s' "$workers" | jq -e '.success == true' >/dev/null; then
            echo "::error::Couldn't list the account's Workers. Check CLOUDFLARE_DEPLOY_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          if ! printf '%s' "$workers" | jq -e --arg worker "$worker" '.result | any(.id == $worker)' >/dev/null; then
            echo "::notice::First deploy: the $worker Worker doesn't exist yet, so there is nothing to roll back to."
            exit 0
          fi
          version="$(bunx wrangler deployments status --json | jq -r '.versions[0].version_id // empty')"
          if [ -z "$version" ]; then
            echo "::error::Couldn't read the live Worker version to roll back to, so nothing was deployed."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        if: steps.fresh.outputs.current == 'true'
        run: |
          message="$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | cut -c 1-100)"
          bunx wrangler deploy --message "${GITHUB_SHA::12}: ${message:-Production deploy}"
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test production
        if: steps.fresh.outputs.current == 'true'
        id: smoke
        run: bun run smoke "$SITE_URL"

      - name: Roll back a failed deploy
        if: failure() && steps.smoke.outcome == 'failure' && steps.previous.outputs.version != ''
        run: |
          bunx wrangler rollback "$VERSION" --name "$WORKER" --yes \
            --message "Smoke test failed for ${GITHUB_SHA::12}"
          echo "::error::Smoke test failed; rolled back to $VERSION"
        env:
          VERSION: ${{ steps.previous.outputs.version }}
          WORKER: ${{ steps.previous.outputs.worker }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
